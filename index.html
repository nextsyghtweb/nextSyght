<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b1f" />

    <!-- ============================================================
         SEO + SOCIAL SHARING
         TODO: replace every "YOUR-DOMAIN.com" below with your real domain
         (also in public/robots.txt and public/sitemap.xml).
         ============================================================ -->
    <title>Nextsyght | Freelance Web Development, E-commerce &amp; Web Apps</title>
    <meta
      name="description"
      content="Nextsyght is a freelance web development studio building fast, modern, mobile-first websites, e-commerce stores and web apps. We build the web you envision."
    />
    <meta name="author" content="Nextsyght" />
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nextsyght" />
    <meta property="og:title" content="Nextsyght | We Build the Web You Envision" />
    <meta
      property="og:description"
      content="Freelance web development studio: websites, e-commerce stores and web apps that are fast, modern and mobile-first."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nextsyght – We Build the Web You Envision" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nextsyght | We Build the Web You Envision" />
    <meta
      name="twitter:description"
      content="Freelance web development studio: websites, e-commerce stores and web apps."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Font: Poppins (swap for Montserrat if you prefer, see tailwind.config.js) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data (helps Google understand the business) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Nextsyght",
        "description": "Freelance web development studio offering website development, e-commerce stores and web apps.",
        "url": "https://YOUR-DOMAIN.com/",
        "logo": "https://YOUR-DOMAIN.com/logo.svg",
        "image": "https://YOUR-DOMAIN.com/og-image.png",
        "slogan": "We Build the Web You Envision"
      }
    </script>

    <!-- If JavaScript is off, make sure content is still visible -->
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
