<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — NextSyght</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3E4; --paper-warm:#F5E9D3; --card:#FFFDF8; --ink:#22314A; --ink-soft:#4A5A76;
    --saffron:#E8A33D; --saffron-deep:#C77F1E; --maroon:#8C2F39; --maroon-deep:#6E1F28; --teal:#2F6F62;
    --line: rgba(34,49,74,0.14); --radius:14px; --shadow:0 10px 30px rgba(34,49,74,0.10);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Work Sans',sans-serif; line-height:1.5; }
  h1,h2,h3{ font-family:'Yatra One',cursive; font-weight:400; margin:0; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 24px; }
  .hidden{ display:none !important; }

  /* ---- login screen ---- */
  #loginScreen{ min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:40px 36px; width:100%; max-width:360px; }
  .login-card h1{ font-size:26px; margin-bottom:6px; }
  .login-card p{ color:var(--ink-soft); font-size:14px; margin:0 0 20px; }
  .login-card input{ width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--line); background:var(--paper); font-size:14px; margin-bottom:14px; }
  .login-card input:focus{ outline:2px solid var(--saffron); outline-offset:1px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px; border-radius:999px; font-weight:700; font-size:14px; border:none; cursor:pointer; width:100%; }
  .btn-primary{ background:var(--maroon); color:#FFF9EF; }
  .btn-primary:hover{ background:var(--maroon-deep); }
  .btn-ghost{ background:none; border:1px solid var(--ink); color:var(--ink); }
  .btn-ghost:hover{ background:var(--ink); color:var(--paper); }
  .btn-sm{ padding:7px 14px; font-size:12.5px; width:auto; border-radius:8px; }
  .btn-danger{ background:transparent; border:1px solid var(--maroon); color:var(--maroon); }
  .btn-danger:hover{ background:var(--maroon); color:#FFF9EF; }
  .login-msg{ font-size:13px; color:var(--maroon); min-height:16px; margin-top:4px; }

  /* ---- dashboard shell ---- */
  header{ background:var(--ink); color:var(--paper); padding:18px 0; }
  header .wrap{ display:flex; align-items:center; justify-content:space-between; }
  header h1{ font-size:20px; color:var(--paper); }
  header a{ color:rgba(251,243,228,0.75); text-decoration:none; font-size:13px; }
  header a:hover{ color:var(--paper); }
  .top-actions{ display:flex; align-items:center; gap:18px; }

  main{ padding:36px 0 80px; }
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:36px; }
  @media (max-width:720px){ .stat-row{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow); }
  .stat-card .num{ font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:600; color:var(--maroon); }
  .stat-card .label{ font-size:12.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-top:4px; }

  .tabs{ display:flex; gap:10px; margin-bottom:26px; border-bottom:1px solid var(--line); }
  .tab-btn{ background:none; border:none; padding:10px 4px; font-size:14.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-right:20px; }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--maroon); }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .toolbar h2{ font-size:22px; }

  /* ---- project form ---- */
  .form-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px 26px; box-shadow:var(--shadow); margin-bottom:28px; }
  .form-card h3{ font-family:'Work Sans',sans-serif; font-weight:700; font-size:16px; margin-bottom:16px; }
  .form-row{ margin-bottom:14px; }
  .form-row.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:600px){ .form-row.two-col{ grid-template-columns:1fr; } }
  label{ display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; }
  input[type=text], input[type=email], input[type=tel], input[type=password], input[type=url], input[type=file], textarea{
    font-family:'Work Sans',sans-serif; font-size:14px; padding:10px 12px; border-radius:8px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink); resize:vertical;
  }
  input:focus, textarea:focus{ outline:2px solid var(--saffron); outline-offset:1px; }
  .form-actions{ display:flex; align-items:center; gap:14px; margin-top:4px; }
  .form-msg{ font-size:13px; }
  .form-msg.ok{ color:var(--teal); }
  .form-msg.err{ color:var(--maroon); }

  /* ---- table-ish list ---- */
  .item-list{ display:flex; flex-direction:column; gap:12px; }
  .item-row{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
    display:flex; gap:16px; align-items:flex-start; box-shadow:var(--shadow);
  }
  .item-row .thumb{ width:76px; height:56px; border-radius:8px; overflow:hidden; background:var(--paper-warm); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ink-soft); }
  .item-row .thumb img{ width:100%; height:100%; object-fit:cover; }
  .item-row .info{ flex:1; min-width:0; }
  .item-row .info h4{ font-size:15px; font-weight:700; margin:0 0 3px; font-family:'Work Sans',sans-serif; }
  .item-row .info .meta{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--teal); margin-bottom:4px; }
  .item-row .info p{ font-size:13px; color:var(--ink-soft); margin:0; }
  .item-row .actions{ display:flex; gap:8px; flex:0 0 auto; }
  .pill{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:3px 9px; border-radius:999px; text-transform:uppercase; }
  .pill-live{ background:rgba(47,111,98,0.16); color:var(--teal); }
  .pill-hidden{ background:rgba(140,47,57,0.14); color:var(--maroon); }
  .stars{ color:var(--saffron-deep); letter-spacing:1.5px; font-size:13px; }

  .empty-note{ font-size:14px; color:var(--ink-soft); font-style:italic; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>Admin Login</h1>
    <p>Sign in with your authorized admin account.</p>
    <form id="loginForm">
      <input type="email" id="emailInput" placeholder="Email address" autocomplete="email" required>
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password" required>
      <button class="btn btn-primary" id="loginBtn" type="submit">Log in</button>
    </form>
    <p class="login-msg" id="loginMsg"></p>
  </div>
</div>

<div id="dashboard" class="hidden">
  <header>
    <div class="wrap">
      <h1>NextSyght — Admin</h1>
      <div class="top-actions">
        <a href="/" target="_blank">View site ↗</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="stat-row" id="statRow">
        <div class="stat-card"><div class="num" id="statProjects">—</div><div class="label">Projects</div></div>
        <div class="stat-card"><div class="num" id="statReviews">—</div><div class="label">Reviews</div></div>
        <div class="stat-card"><div class="num" id="statPending">—</div><div class="label">Hidden reviews</div></div>
        <div class="stat-card"><div class="num" id="statAvg">—</div><div class="label">Avg. rating (live)</div></div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="projects">Projects</button>
        <button class="tab-btn" data-tab="settings">Contact Details</button>
        <button class="tab-btn" data-tab="enquiries">Enquiries</button>
        <button class="tab-btn" data-tab="reviews">Reviews</button>
      </div>

      <!-- PROJECTS PANEL -->
      <section class="panel active" id="panel-projects">
        <div class="form-card">
          <h3 id="projectFormTitle">Add a project</h3>
          <form id="projectForm">
            <input type="hidden" id="projectId" value="">
            <div class="form-row two-col">
              <label>Title
                <input type="text" name="title" id="pTitle" required>
              </label>
              <label>Category
                <input type="text" name="category" id="pCategory" placeholder="e.g. Website Audit, Local SEO">
              </label>
            </div>
            <div class="form-row">
              <label>Description
                <textarea name="description" id="pDescription" rows="2"></textarea>
              </label>
            </div>
            <div class="form-row two-col">
              <label>Location
                <input type="text" name="location" id="pLocation" placeholder="City or area">
              </label>
              <label>Price
                <input type="text" name="price" id="pPrice" placeholder="e.g. ₹25,000">
              </label>
            </div>
            <div class="form-row">
              <label>Status
                <input type="text" name="status" id="pStatus" value="active" placeholder="active, completed, upcoming">
              </label>
            </div>
            <div class="form-row two-col">
              <label>Live URL
                <input type="url" name="project_url" id="pUrl" placeholder="https://">
              </label>
              <label>Screenshot <span style="font-weight:400;color:var(--ink-soft);">(optional when editing)</span>
                <input type="file" name="image" id="pImage" accept="image/png,image/jpeg,image/webp">
              </label>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary btn-sm" id="projectSubmitBtn">Add project</button>
              <button type="button" class="btn btn-ghost btn-sm hidden" id="projectCancelBtn">Cancel edit</button>
              <span class="form-msg" id="projectMsg"></span>
            </div>
          </form>
        </div>

        <div class="toolbar"><h2>All projects</h2></div>
        <div class="item-list" id="projectList"><p class="empty-note">Loading…</p></div>
      </section>

      <!-- SETTINGS PANEL -->
      <section class="panel" id="panel-settings">
        <div class="form-card">
          <h3>Contact Details</h3>
          <form id="settingsForm">
            <div class="form-row two-col">
              <label>Phone 1
                <input type="tel" name="phone_1" id="sPhone1">
              </label>
              <label>Phone 2
                <input type="tel" name="phone_2" id="sPhone2">
              </label>
            </div>
            <div class="form-row two-col">
              <label>WhatsApp Number
                <input type="tel" name="whatsapp_number" id="sWhatsapp">
              </label>
              <label>Email
                <input type="email" name="email" id="sEmail">
              </label>
            </div>
            <div class="form-row">
              <label>Address
                <textarea name="address" id="sAddress" rows="3"></textarea>
              </label>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary btn-sm">Save contact details</button>
              <span class="form-msg" id="settingsMsg"></span>
            </div>
          </form>
        </div>
      </section>

      <!-- ENQUIRIES PANEL -->
      <section class="panel" id="panel-enquiries">
        <div class="toolbar">
          <h2>Customer Enquiries</h2>
          <input type="text" id="enquirySearch" placeholder="Search enquiries" style="max-width:260px;padding:9px 12px;border:1px solid var(--line);border-radius:8px">
        </div>
        <div class="item-list" id="enquiryList"><p class="empty-note">Loading…</p></div>
      </section>

      <!-- REVIEWS PANEL -->
      <section class="panel" id="panel-reviews">
        <div class="toolbar"><h2>All reviews</h2></div>
        <div class="item-list" id="reviewList"><p class="empty-note">Loading…</p></div>
      </section>
    </div>
  </main>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
